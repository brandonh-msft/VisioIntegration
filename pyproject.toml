[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visio-azure-mcp"
version = "0.2.0"
description = "MCP server for drawing Azure architecture diagrams in Visio with WAF/CAF alignment"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "pydantic>=2.0.0,<3",
    "pywin32>=306,<400; platform_system == 'Windows'",
    "playwright>=1.40.0,<2",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.38.0,<2",
    "openai>=1.40.0,<2",
]
desktop = [
    "streamlit>=1.38.0,<2",
    "openai>=1.40.0,<2",
    "pywebview>=5.0,<6",
    "pyinstaller>=6.0,<7",
]
vsdx = [
    "vsdx>=0.5.0,<1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/CloudDaddyZA/VisioIntegration"
Issues = "https://github.com/CloudDaddyZA/VisioIntegration/issues"

[project.scripts]
visio-mcp = "visio_mcp.server:main"
visio-app = "app.run:main"
visio-desktop = "app.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visio_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
